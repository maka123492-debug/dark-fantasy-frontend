<h3>Add Todo Item</h3>

<div>
  <label>Title:</label>
  <input
    [ngModel]="title()"
    (ngModelChange)="title.set($event)">
</div>

<br>

<div>
  <label>
    <input
      type="checkbox"
      [ngModel]="completed()"
      (ngModelChange)="completed.set($event)">
    Completed
  </label>
</div>

<br>

<button (click)="save()">
  Save
</button>

<button [routerLink]="['/']">
  Cancel
</button>
